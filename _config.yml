title: Lucy's Corner
description: >-
  A warm little corner of the internet for Lucy, a rescue Cocker Spaniel —
  photos, stories, and her favorite finds.
url: "https://amotremba.github.io"
baseurl: "/Lucyscorner"

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed

feed:
  path: blog/feed.xml

markdown: kramdown

# Working notes, not site content. Jekyll copies root-level .md files into the
# build output, so these would otherwise be served at /<name>.md alongside the
# published pages. These stay readable on GitHub — they're the working record —
# but aren't published with the site.
exclude:
  - substack-drafts.md
  - substack-welcome-email-draft.md
  - substack-about-page-draft.md
  - session-log-2026-09-30.md
  - social-media-project.md
  - pinterest-project.md
  - social-media-growth-plan.md
